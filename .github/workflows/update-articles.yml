name: Sync Hashnode articles to CMS

on:
  schedule:
    - cron: '0 0 1 * *' # run monthly on day 1
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: article-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request article sync
        env:
          ARTICLE_SYNC_TOKEN: ${{ secrets.ARTICLE_SYNC_TOKEN }}
        run: |
          test -n "$ARTICLE_SYNC_TOKEN"
          curl --fail --show-error --silent \
            --retry 3 \
            --retry-delay 5 \
            --connect-timeout 10 \
            --max-time 60 \
            --request POST \
            --header "X-Article-Sync-Token: $ARTICLE_SYNC_TOKEN" \
            https://api.rafnixg.dev/api/admin/sync/articles
