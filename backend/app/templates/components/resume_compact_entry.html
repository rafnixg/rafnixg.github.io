<div class="resume-compact-entry"><div><strong>{{ entry_title }}</strong>{% if entry_context %}<span>{{ entry_context }}</span>{% endif %}</div>{% if item.get('date') or item.get('releaseDate') %}<time datetime="{{ item.get('date', item.get('releaseDate', '')) }}">{{ item.get('date', item.get('releaseDate', ''))[:4] }}</time>{% endif %}{% if item.get('url')|https_url %}<a class="resume-text-link" href="{{ item.url }}" rel="noopener noreferrer" target="_blank" aria-label="Abrir {{ entry_title }}">Abrir</a>{% endif %}</div>
