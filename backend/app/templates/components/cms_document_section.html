<section id="{{ section_id }}" class="section"><h1 class="text-3xl font-bold">{{ section_title }}</h1><p class="muted">{{ section_description }}</p>{% if tabs_id is defined %}<div id="{{ tabs_id }}" class="inner-tabs" role="tablist" aria-label="Secciones de {{ section_title }}"></div>{% endif %}<div id="{{ fields_id }}" role="tabpanel"></div><div class="actions"><button id="{{ save_id }}">{{ save_label }}</button><span class="status" id="{{ status_id }}" role="status"></span></div>{% if section_id == 'seo' %}<div class="panel"><a href="/sitemap.xml" target="_blank">Ver sitemap ↗</a> · <a href="/robots.txt" target="_blank">Ver robots.txt ↗</a></div>{% endif %}</section>
