<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acceso al CMS — Rafnixg.dev</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b1020;color:#e8ecf5;font:16px system-ui,sans-serif}.card{width:min(92vw,420px);padding:2rem;border:1px solid #28324a;border-radius:1rem;background:#121a2c}h1{margin-top:0}label{display:block;margin:.9rem 0 .35rem}input,button{width:100%;padding:.8rem;border:1px solid #35415e;border-radius:.5rem;background:#0b1020;color:inherit;font:inherit}button{margin-top:1rem;background:#5271ff;border:0;font-weight:700;cursor:pointer}.hint{color:#aeb9d0;font-size:.9rem}
  </style>
</head>
<body><main class="card"><h1>Panel de administración</h1><p class="hint">Rafnixg.dev CMS</p>
  <form method="post" action="/admin/login">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label for="username">Usuario</label><input id="username" name="username" autocomplete="username" required>
    <label for="password">Contraseña</label><input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Iniciar sesión</button>
  </form>
</main></body></html>
